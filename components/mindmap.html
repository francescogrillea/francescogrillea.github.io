<style id="dt-ecosystem-styles">
    .dt-ecosystem {
        position: relative;
        isolation: isolate;
        width: 100%;
        margin: 0;
        height: clamp(250px, 33cqw, 390px);
        overflow: hidden;
        color: var(--text-color-primary);
        background: transparent;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .content-container--ecosystem>.content-title {
        margin-bottom: 0;
    }

    .content-container--ecosystem {
        container-type: inline-size;
    }

    .dt-ecosystem,
    .dt-ecosystem * {
        box-sizing: border-box;
    }

    .dt-ecosystem__viewport {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overflow-y: hidden;
        background: transparent;
        scrollbar-width: thin;
        scrollbar-color: var(--border-light) transparent;
        overscroll-behavior-inline: contain;
    }

    .dt-ecosystem__viewport::-webkit-scrollbar {
        height: 5px;
    }

    .dt-ecosystem__viewport::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: var(--border-light);
    }

    .dt-ecosystem__graph {
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        height: 100%;
        overflow: visible;
        background: transparent;
    }

    .dt-ecosystem__base-edge {
        display: none;
    }

    .dt-ecosystem__flow-edge {
        fill: none;
        stroke: url(#dt-flow-gradient);
        stroke-width: 0.65;
        stroke-linecap: round;
        opacity: 0.48;
        vector-effect: non-scaling-stroke;
    }

    .dt-ecosystem__particle {
        fill: var(--accent-secondary);
        filter: url(#dt-particle-glow) drop-shadow(0 0 4px var(--accent-glow));
        opacity: 0.78;
    }

    .dt-ecosystem__node {
        outline: none;
        cursor: default;
    }

    .dt-ecosystem__node-core {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 180ms ease, filter 180ms ease;
    }

    .dt-ecosystem__node-circle {
        width: 64px;
        height: 64px;
        border: 2px solid transparent;
        border-radius: 50%;
        background:
            linear-gradient(var(--glass-surface), var(--glass-surface)) padding-box,
            var(--gradient-brand) border-box;
        transition: border-color 180ms ease;
    }

    .dt-ecosystem__icon {
        fill: none;
        stroke: var(--text-color-primary);
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 180ms ease;
        pointer-events: none;
    }

    .dt-ecosystem__label {
        fill: var(--text-color-secondary);
        font-size: 13px;
        font-weight: 520;
        letter-spacing: 0.01em;
        text-anchor: middle;
        pointer-events: none;
        transition: fill 180ms ease;
    }

    .dt-ecosystem__node:hover .dt-ecosystem__node-core {
        transform: scale(1.06);
        filter: drop-shadow(0 0 11px var(--accent-glow));
    }

    .dt-ecosystem__node:hover .dt-ecosystem__node-circle {
        border-color: var(--accent-primary);
    }

    .dt-ecosystem__node:hover .dt-ecosystem__icon {
        stroke: var(--text-color-primary);
    }

    .dt-ecosystem__node:hover .dt-ecosystem__label {
        fill: var(--text-color-secondary);
    }

    @media (max-width: 700px) {
        .dt-ecosystem {
            height: auto;
            aspect-ratio: 1120 / 365;
        }

        .dt-ecosystem__label {
            font-size: 13px;
        }

        .dt-ecosystem__flow-edge {
            stroke-width: 0.75;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .dt-ecosystem__particle {
            display: none;
        }

        .dt-ecosystem__node-core,
        .dt-ecosystem__node-circle,
        .dt-ecosystem__icon,
        .dt-ecosystem__label {
            transition: none !important;
        }
    }
</style>
