<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Francesco Grillea :: Education</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">

  <!--  for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/font.css">
  <link rel="stylesheet" href="assets/css/page-content.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/accent-gradient.css">
  <link rel="stylesheet" href="assets/css/theme-transition.css">
  <link rel="stylesheet" href="assets/css/certifications.css">

  <script src="assets/js/theme.js"></script>

</head>

<body>

  <header class="site-header" id="header-container"></header>


  <div class="content-wrapper">
    <div id="sidebar-container"></div>

    <main>
      <h1 class="typewriter-animation">Education</h1>
      <div class="content-container">

        <div class="content-title">Certifications and Courses</div>
        <section class="certs-section">
          <div class="honeycomb-grid" id="honeycomb">

            <!-- Row 1: 4 badges -->
            <div class="honeycomb-row">
              <div class="hex-cell">
                <div class="hex-badge" data-index="0">
                  <div class="hex-border">
                    <div class="hex-inner">
                      <div class="badge-img-wrapper">
                        <img src="https://cdn.simpleicons.org/amazonaws/FF9900" alt="AWS">
                      </div>
                      <div class="badge-title">Machine Learning Specialty</div>
                      <div class="badge-subtitle">Amazon Web Services · 2024</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="hex-cell">
                <div class="hex-badge" data-index="1">
                  <div class="hex-border">
                    <div class="hex-inner">
                      <div class="badge-img-wrapper">
                        <img src="https://cdn.simpleicons.org/microsoftazure/0078D4" alt="Azure">
                      </div>
                      <div class="badge-title">Azure Administrator</div>
                      <div class="badge-subtitle">Microsoft · 2024</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="hex-cell">
                <div class="hex-badge" data-index="2">
                  <div class="hex-border">
                    <div class="hex-inner">
                      <div class="badge-img-wrapper">
                        <img src="https://cdn.simpleicons.org/googlecloud/4285F4" alt="GCP">
                      </div>
                      <div class="badge-title">Cloud Architect</div>
                      <div class="badge-subtitle">Google Cloud · 2023</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="hex-cell">
                <div class="hex-badge" data-index="3">
                  <div class="hex-border">
                    <div class="hex-inner">
                      <div class="badge-img-wrapper">
                        <img src="https://cdn.simpleicons.org/kubernetes/326CE5" alt="Kubernetes">
                      </div>
                      <div class="badge-title">CKA Kubernetes</div>
                      <div class="badge-subtitle">CNCF · 2024</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </section>
      </div>



    </main>


  </div>


  <script src="assets/js/page-transitions.js"></script>
  <script src="assets/js/load_header.js"></script>
  <script src="assets/js/load_sidebar.js"></script>

</body>

</html>
