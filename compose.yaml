services:
  editor:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.editor
        required: false
    environment:
      PORTFOLIO_MODE: editor
      EDITOR_DATA_DIR: /data
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - editor-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/edit').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  editor-data:
